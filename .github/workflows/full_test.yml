name: Full test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Start frontend
        run: |
          cd front/
          sed -i 's/MODE=prod/MODE=dev/' .env
          sed -i '/^BASE_DOMAIN/d' .env
          sed -i '/^ALLOWED_HOSTS/d' .env && printf "\nALLOWED_HOSTS=http://localhost,http://172.18.0.2,http://172.18.0.3" >> .env
          docker compose up -d

      - name: Start selenium
        run: |
          cd front/tests/docker
          docker compose up -d

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Check availability
        run: |
          docker ps
          curl -f localhost

      - name: Run tests
        run: |
          sudo bash -c '
            source .venv/bin/activate
            python -m pytest -vv -s front/tests
          '
