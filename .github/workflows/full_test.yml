name: Full test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Start frontend
        run: |
          cd front/
          sed -i 's/MODE=prod/MODE=dev/' .env
          sed -i '/^BASE_DOMAIN/d' .env
          sed -i '/^ALLOWED_HOSTS/d' .env && printf "\nALLOWED_HOSTS=http://localhost,http://172.18.0.2,http://172.18.0.3" >> .env
          docker compose up -d

      - name: Start selenium
        run: |
          cd front/tests/docker
          docker compose up -d

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Check availability
        run: |
          docker ps
          curl -f localhost

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
          N_SHARDS: 3
        run: |
          sudo SHARD="$SHARD" N_SHARDS="$N_SHARDS" bash -c '
            source .venv/bin/activate
            mkdir -p .tmp
            files=$(find front/tests -maxdepth 1 -name "test_*.py" | sort)
            slice=$(echo "$files" | awk -v n="$N_SHARDS" -v s="$SHARD" "NR % n == s-1")
            [ -n "$slice" ] || { echo "ERROR: shard $SHARD/$N_SHARDS got an empty slice" >&2; exit 1; }
            echo "Shard $SHARD/$N_SHARDS (files: $slice)"
            set -o pipefail
            python -m pytest -vv -s $slice 2>&1 | tee .tmp/full-test-shard-$SHARD.log
          '

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-test-logs-shard-${{ matrix.shard }}
          path: .tmp/full-test-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
