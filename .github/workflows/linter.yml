name: Linter

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['back', 'front']
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies (back)
        if: ${{ matrix.node == 'back' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mininet
          mkdir -p /opt/mininet_dependencies

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Lint with ty
        run: |
          uv run --frozen ty check --no-progress ${{matrix.node}}

      - name: Format with ruff
        run: |
          uv run --frozen ruff format --check --verbose ${{matrix.node}}

      - name: Lint with ruff
        run: |
          uv run --frozen ruff check --verbose ${{matrix.node}}
