name: Pytest

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install apt package
        run: |
          sudo apt-get update \
          && sudo apt-get install -y --no-install-recommends \
          ifupdown \
          iproute2 \
          iptables \
          traceroute \
          curl \
          dnsutils \
          netcat-openbsd \
          openssh-client \
          iputils-ping \
          mininet \
          net-tools \
          bridge-utils \
          tcpdump \
          gcc \
          make \
          libpcap-dev \
          libbsd-dev \
          dnsmasq \
          isc-dhcp-client \
          openvswitch-switch \
          git
          sudo touch /etc/network/interfaces
          sudo mkdir -p /opt/mininet_dependencies

      - name: Build mimidump
        run: |
          git clone https://github.com/mimi-net/mimidump.git
          cd mimidump && sudo make prefix=/usr install

      - name: Disable packet transmission to filters
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0
          sudo sysctl -w net.bridge.bridge-nf-call-arptables=0
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl -p

      - name: Run Open VSwitch
        run: |
          # back/ovs-init.sh is the single source of truth for OVS startup
          # (also used by the prod image ENTRYPOINT and the local harness).
          sudo bash back/ovs-init.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --project back

      - name: Test with pytest
        env:
          SHARD: ${{ matrix.shard }}
          N_SHARDS: 3
        run: |
          sudo SHARD="$SHARD" N_SHARDS="$N_SHARDS" bash -c '
            set -euo pipefail
            source .venv/bin/activate
            cd back/tests
            export PYTHONPATH=${PYTHONPATH:-}:../src
            files=$(find . -name "test_*.py" | sort) || { echo "ERROR: find/sort failed" >&2; exit 1; }
            slice=()
            idx=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              idx=$((idx + 1))
              if [ $((idx % N_SHARDS)) -eq $((SHARD - 1)) ]; then
                slice+=("$f")
              fi
            done <<<"$files"
            [ "${#slice[@]}" -gt 0 ] || { echo "ERROR: shard $SHARD/$N_SHARDS got an empty slice" >&2; exit 1; }
            echo "Shard $SHARD/$N_SHARDS (${#slice[@]} files)"
            printf '%s\n' "${slice[@]}"
            # Run under coverage (branch mode) so per-shard data can be merged
            # into a whole-suite back/src report by the `coverage` job.
            # --data-file is relative to cwd (back/tests); --source=../src maps
            # to back/src. Each shard runs on its own runner, so the names are
            # unique per shard.
            python -m coverage run --branch --source=../src --data-file=".coverage.shard${SHARD}" -m pytest -vv -s -o log_file=/dev/null -o log_cli=true -o log_cli_level=INFO "${slice[@]}" 2>&1 | tee back_test.log
          '

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: back/tests/back_test.log
          if-no-files-found: ignore

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: back-coverage-shard-${{ matrix.shard }}
          path: back/tests/.coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn

  coverage:
    name: Backend coverage report
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --project back

      - name: Download coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: back-coverage-shard-*
          path: .tmp/cov
          merge-multiple: true

      - name: Combine and report
        env:
          N_SHARDS: 3
        run: |
          source .venv/bin/activate
          cd .tmp/cov
          files=$(find . -name ".coverage.shard*" | sort) || { echo "ERROR: find failed" >&2; exit 1; }
          [ -n "$files" ] || { echo "ERROR: no coverage data collected" >&2; exit 1; }
          echo "Combining:"
          printf '%s\n' "$files"
          # A partial merge (fewer shard files than the matrix) would silently
          # understate the whole-suite report and could hide a real regression,
          # so assert the full shard count before reporting.
          n_files=$(printf '%s\n' "$files" | wc -l)
          [ "$n_files" -eq "$N_SHARDS" ] || { echo "ERROR: expected $N_SHARDS coverage data files, got $n_files" >&2; exit 1; }
          # shellcheck disable=SC2086
          python -m coverage combine $files
          # Gate at the measured whole-suite baseline (76.15% statements on
          # upstream/main after the W4a tooling landed) rounded down to 75%.
          python -m coverage report --fail-under=75
          python -m coverage json -o coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: back-coverage-report
          path: .tmp/cov/coverage.json
          include-hidden-files: true
          if-no-files-found: ignore