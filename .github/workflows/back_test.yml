name: Pytest

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install apt package
        run: |
          sudo apt-get update \
          && sudo apt-get install -y --no-install-recommends \
          ifupdown \
          iproute2 \
          iptables \
          traceroute \
          curl \
          dnsutils \
          netcat-openbsd \
          openssh-client \
          iputils-ping \
          mininet \
          net-tools \
          bridge-utils \
          tcpdump \
          gcc \
          make \
          libpcap-dev \
          libbsd-dev \
          dnsmasq \
          isc-dhcp-client \
          openvswitch-switch \
          git
          sudo touch /etc/network/interfaces
          sudo mkdir -p /opt/mininet_dependencies

      - name: Build mimidump
        run: |
          git clone https://github.com/mimi-net/mimidump.git
          cd mimidump && sudo make prefix=/usr install

      - name: Disable packet transmission to filters
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0
          sudo sysctl -w net.bridge.bridge-nf-call-arptables=0
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl -p

      - name: Run Open VSwitch
        run: |
          # back/ovs-init.sh is the single source of truth for OVS startup
          # (also used by the prod image ENTRYPOINT and the local harness).
          sudo bash back/ovs-init.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --project back

      - name: Test with pytest
        env:
          SHARD: ${{ matrix.shard }}
          N_SHARDS: 3
        run: |
          sudo SHARD="$SHARD" N_SHARDS="$N_SHARDS" bash -c '
            set -euo pipefail
            source .venv/bin/activate
            cd back/tests
            export PYTHONPATH=${PYTHONPATH:-}:../src
            files=$(find . -name "test_*.py" | sort) || { echo "ERROR: find/sort failed" >&2; exit 1; }
            slice=()
            idx=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              idx=$((idx + 1))
              if [ $((idx % N_SHARDS)) -eq $((SHARD - 1)) ]; then
                slice+=("$f")
              fi
            done <<<"$files"
            [ "${#slice[@]}" -gt 0 ] || { echo "ERROR: shard $SHARD/$N_SHARDS got an empty slice" >&2; exit 1; }
            echo "Shard $SHARD/$N_SHARDS (${#slice[@]} files)"
            printf '%s\n' "${slice[@]}"
            python -m pytest -vv -s -o log_file=/dev/null -o log_cli=true -o log_cli_level=INFO "${slice[@]}" 2>&1 | tee back_test.log
          '

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: back/tests/back_test.log
          if-no-files-found: ignore