[tool.uv.workspace]
members = ["back", "front"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W605"]
ignore = ["E501", "W391", "C901", "E203"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]

[[tool.ty.overrides]]
include = ["**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["**"]

# Staging: ty checks untyped bodies (mypy skipped them), so front/tests carries
# ~133 diagnostics today. mypy never meaningfully checked these files (untyped
# defs) — this is not a coverage regression. Re-enable once src is clean.
[[tool.ty.overrides]]
include = ["front/tests"]

[tool.ty.overrides.rules]
all = "ignore"
