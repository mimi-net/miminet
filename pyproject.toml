[tool.uv.workspace]
members = ["back", "front"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "W391", "C901", "E203"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]

[[tool.ty.overrides]]
include = ["**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["**"]
