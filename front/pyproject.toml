[project]
name = "miminet-front"
version = "0.1.0"
description = "Miminet frontend"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "beautifulsoup4==4.13.5",
    "celery==5.6.3",
    "dpkt==1.9.8",
    "Flask==3.1.2",
    "Flask-Admin==2.0.1",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "flask-cors==6.0.2",
    "flask-jwt-extended==4.7.1",
    "google-auth==2.40.3",
    "google-auth-oauthlib==1.2.2",
    "jsonschema==4.25.1",
    "openai>=1.0.0",
    "Pillow==11.3.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.3",
    "requests==2.32.5",
    "requests-oauthlib==2.0.0",
    "SQLAlchemy==2.0.43",
    "websocket-client==1.8.0",
    "wtforms==3.2.1",
]

[dependency-groups]
